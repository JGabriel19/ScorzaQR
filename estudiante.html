<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Estudiante - Manuel Scorza</title>
    <link rel="stylesheet" href="css/styles_estudiante.css" />

    <style>
      #qrcode {
        margin-top: 20px;
        display: flex;
        justify-content: center;
      }
    </style>
  </head>

  <body>
    <main class="container">
      <section class="card">
        <div
          style="
            display: flex;
            align-items: center;
            justify-content: space-between;
          ">
          <div>
            <h2>Panel Estudiante</h2>
            <p id="welcome" class="hint"></p>
          </div>

          <div>
            <button id="logoutBtn" class="btn">Salir</button>
          </div>
        </div>

        <hr style="margin: 12px 0" />

        <p>
          Este es tu panel personal como estudiante. Desde aquí podrás acceder y
          visualizar tu código QR de asistencia
        </p>

        <!-- Contenedor donde irá el QR -->
        <h3>Tu código QR de asistencia</h3>
        <div id="qrcode"></div>
      </section>
    </main>

    <!-- Base de datos y funciones de sesión -->
    <script src="db.js"></script>

    <!-- Librería QR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script>
      // Obtener sesión
      const usuario = obtenerSesion();

      // Validación de acceso
      if (!usuario || usuario.role !== "estudiante") {
        window.location.href = "index.html";
      }

      // Mostrar saludo
      document.getElementById("welcome").textContent =
        "Hola, " + usuario.nombre + " — Rol: Estudiante";

      // Generar QR SOLO con el nombre
      const qr = new QRCode(document.getElementById("qrcode"), {
        width: 200,
        height: 200,
      });

      qr.makeCode(usuario.nombre);

      // Cerrar sesión
      const logoutBtn = document.getElementById("logoutBtn");
      logoutBtn.addEventListener("click", () => {
        cerrarSesion();
        window.location.href = "index.html";
      });
    </script>
  </body>
</html>
